[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comply-agent"
version = "0.2.0"
description = "AI Agent OWASP Agentic Top 10 Compliance Scanner"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Zeyu Zhang"}]
keywords = ["ai", "compliance", "owasp", "agent", "security", "audit"]
classifiers = [
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
comply-agent = "comply_agent.cli:main"

[tool.setuptools.packages.find]
include = ["comply_agent*"]

[tool.setuptools.package-data]
comply_agent = ["../rules/*.yaml"]
